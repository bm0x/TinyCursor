name: Release & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($raw)) {
            $raw = "${{ inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($raw)) {
            $raw = "v0.1.0"
          }
          $clean = $raw -replace '^v',''
          Write-Host "Determined Release Version: $raw (numeric: $clean)"
          "raw=$raw" >> $env:GITHUB_OUTPUT
          "clean=$clean" >> $env:GITHUB_OUTPUT

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Generate Windows UIAccess Manifest Resource
        run: |
          python tools/make_res.py

      - name: Run Unit Tests
        run: |
          cargo test --release

      - name: Build Optimized Release Binary
        run: |
          cargo rustc --release -- -C linker=rust-lld -C link-arg="manifest.res"

      - name: Prepare Portable ZIP Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/TinyCursor" -Force | Out-Null
          Copy-Item -Path "target/release/tiny-cursor.exe" -Destination "dist/TinyCursor/"
          Copy-Item -Path "assets" -Destination "dist/TinyCursor/assets" -Recurse
          Compress-Archive -Path "dist/TinyCursor/*" -DestinationPath "TinyCursor-Portable-x64.zip"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.clean }}"
          Write-Host "Compiling Inno Setup installer for version: $ver"
          # iscc is pre-installed on windows-latest runners
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss
          if (-not (Test-Path "Output/TinyCursor-Setup-x64.exe")) {
            Write-Error "Installer binary not generated!"
            exit 1
          }

      # SignPath Foundation Signing Integration
      # Gracefully skipped if SignPath secrets are not yet configured
      - name: Upload Unsigned Installer for SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-installer
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: Output/TinyCursor-Setup-x64.exe

      - name: Submit Signing Request to SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Replace Installer with Signed Binary
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        shell: pwsh
        run: |
          if (Test-Path "signed/TinyCursor-Setup-x64.exe") {
            Copy-Item -Path "signed/TinyCursor-Setup-x64.exe" -Destination "Output/TinyCursor-Setup-x64.exe" -Force
            Write-Host "Replaced unsigned installer with SignPath Authenticode-signed binary."
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 Output/TinyCursor-Setup-x64.exe, TinyCursor-Portable-x64.zip |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.raw }}
          name: TinyCursor ${{ steps.get_version.outputs.raw }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Output/TinyCursor-Setup-x64.exe
            TinyCursor-Portable-x64.zip
            SHA256SUMS.txt
