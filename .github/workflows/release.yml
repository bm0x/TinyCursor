name: Release & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Generate Windows UIAccess Manifest Resource
        run: |
          python tools/make_res.py

      - name: Run Unit Tests
        run: |
          cargo test --release

      - name: Build Optimized Release Binary
        run: |
          cargo rustc --release -- -C linker=rust-lld -C link-arg="manifest.res"

      - name: Prepare Portable ZIP Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/TinyCursor" -Force | Out-Null
          Copy-Item -Path "target/release/tiny-cursor.exe" -Destination "dist/TinyCursor/"
          Copy-Item -Path "assets" -Destination "dist/TinyCursor/assets" -Recurse
          Compress-Archive -Path "dist/TinyCursor/*" -DestinationPath "TinyCursor-Portable-x64.zip"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          # iscc is pre-installed on windows-latest runners
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "Output/TinyCursor-Setup-x64.exe")) {
            Write-Error "Installer binary not generated!"
            exit 1
          }

      # Optional SignPath Foundation Signing (Active when repository secrets are provided)
      - name: Submit Signing Request to SignPath (Installer)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-configuration-slug: 'installer'
          parameters: |
            input-artifact: Output/TinyCursor-Setup-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: TinyCursor ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Output/TinyCursor-Setup-x64.exe
            TinyCursor-Portable-x64.zip
