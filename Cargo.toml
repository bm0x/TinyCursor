[package]
name = "tiny-cursor"
version = "0.1.0"
edition = "2021"
authors = ["TinyCursor Team"]
description = "High-performance smooth cursor with spring physics for desktop"
license = "MIT"
repository = "https://github.com/bm0x/TinyCursor"
homepage = "https://tinycursor.vercel.app"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_Security",
    "Foundation_Numerics",
] }
# Pure native implementation with zero external crates for instant compilation,
# maximum security, and sub-millisecond responsiveness.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
